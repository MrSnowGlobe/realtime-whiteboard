name: Deploy Preview

on:
  # Trigger on pull requests
  pull_request:
    branches:
      - main
      - master

  # Allow manual preview deployment
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Preview Environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

      - name: Comment Preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment is ready!\n\nPreview URL: `https://preview.realtime-whiteboard.workers.dev`\n\nThis preview will be available until the PR is merged or closed.'
            })
