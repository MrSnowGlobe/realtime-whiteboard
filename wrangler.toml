name = "realtime-whiteboard"
main = "src/worker/index.js"
compatibility_date = "2024-01-01"

# Durable Objects bindings
[durable_objects]
bindings = [
  { name = "WHITEBOARD_DO", class_name = "WhiteboardDurableObject" }
]

# Enable Durable Objects migrations
[[migrations]]
tag = "v1"
new_classes = ["WhiteboardDurableObject"]

# KV namespace for session metadata
# REQUIRED: Create your KV namespace and add the ID here before deploying
# Run: wrangler kv:namespace create "SESSIONS_KV"
# Then uncomment and add the ID below:
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "c83d5dc3a6f440a3af93426c7374c192"

# R2 bucket for image storage
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "whiteboard-images"

# Build configuration
[build]
command = "node build-assets.js"
watch_dirs = ["src"]

# Environment variables (add your own as needed)
[vars]
ENVIRONMENT = "development"
MAX_IMAGE_SIZE_MB = "10"
AUTO_SAVE_INTERVAL_MS = "30000"
