<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Collaborative Whiteboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <div id="toolbar">
            <div class="toolbar-section">
                <h1 class="logo">Whiteboard</h1>
            </div>

            <!-- Drawing Tools -->
            <div class="toolbar-section tools">
                <button class="tool-btn active" data-tool="pen" title="Pen (P)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="line" title="Line (L)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="19" x2="19" y2="5"></line>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="circle" title="Circle (C)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="text" title="Text (T)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" opacity="0.3"></path>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16c-1-1-1-2.5 0-3.5l9-9c1-1 2.5-1 3.5 0l5 5c1 1 1 2.5 0 3.5L13 20"></path>
                        <line x1="7" y1="20" x2="20" y2="20"></line>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="select" title="Select (V)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                    </svg>
                </button>
            </div>

            <!-- Color Picker -->
            <div class="toolbar-section">
                <label>Color:</label>
                <input type="color" id="color-picker" value="#000000">
                <div id="color-palette" class="color-palette"></div>
            </div>

            <!-- Stroke Width -->
            <div class="toolbar-section">
                <label>Width:</label>
                <input type="range" id="stroke-width" min="1" max="20" value="2">
                <span id="stroke-width-value">2</span>
            </div>

            <!-- Opacity -->
            <div class="toolbar-section">
                <label>Opacity:</label>
                <input type="range" id="opacity" min="0" max="100" value="100" step="10">
                <span id="opacity-value">100%</span>
            </div>

            <!-- Image Upload -->
            <div class="toolbar-section">
                <button id="upload-image-btn" class="tool-btn" title="Upload Image">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <input type="file" id="image-input" accept="image/*" style="display: none;">
            </div>

            <!-- Session Info -->
            <div class="toolbar-section session-info">
                <button id="night-mode-btn" class="tool-btn" title="Toggle Night Mode">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button id="share-btn" class="btn-primary" title="Share Board">
                    Share
                </button>
                <div id="users-indicator" class="users-indicator">
                    <span id="user-count">0</span> users
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="cursors-container"></div>
        </div>

        <!-- Users Panel -->
        <div id="users-panel" class="panel">
            <h3>Active Users</h3>
            <div id="users-list"></div>
        </div>

        <!-- Audit Log Panel -->
        <div id="audit-panel" class="panel audit-panel">
            <h3>Activity Log</h3>
            <div id="audit-log-list" class="audit-log-list"></div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
            <p>Connecting to whiteboard...</p>
        </div>

        <!-- Share Modal -->
        <div id="share-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Share this Whiteboard</h2>
                <p>Share this URL with others to collaborate:</p>
                <div class="share-url-container">
                    <input type="text" id="share-url" readonly>
                    <button id="copy-url-btn" class="btn-primary">Copy</button>
                </div>
                <p class="hint">Anyone with this link can view and edit this whiteboard.</p>
            </div>
        </div>
    </div>

    <!-- Import constants -->
    <script type="module">
        // Import constants
        window.CONSTANTS = await import('./constants.js');
    </script>

    <!-- Main application script -->
    <script type="module" src="/app.js"></script>
</body>
</html>
